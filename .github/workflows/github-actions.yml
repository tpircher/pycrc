name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Test with pytest
        run: pytest --cov=pycrc --cov-report=term-missing
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/pycrc-venv
          /tmp/pycrc-venv/bin/python -m pip install --upgrade pip
          /tmp/pycrc-venv/bin/python -m pip install dist/*.whl
          test "$(/tmp/pycrc-venv/bin/python -m pycrc --model crc-32 --check-string 123456789)" = "0xcbf43926"
          test "$(/tmp/pycrc-venv/bin/pycrc --model crc-32 --check-string 123456789)" = "0xcbf43926"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
