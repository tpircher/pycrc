[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycrc"
description = "A free, easy to use Cyclic Redundancy Check source code generator for C/C++"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Thomas Pircher", email = "thp.oss@p5r.uk" },
]
requires-python = ">=3.10"
keywords = ["crc", "checksum", "cyclic-redundancy-check", "code-generator", "c"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://pycrc.org"
Documentation = "https://pycrc.org/pycrc.html"
"Bug Tracker" = "https://github.com/tpircher/pycrc/issues"
"Source Code" = "https://github.com/tpircher/pycrc"

[project.scripts]
pycrc = "pycrc.main:main"

[tool.hatch.version]
path = "src/pycrc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pycrc"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/test",
    "/doc",
    "/AUTHORS",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["UP030"]

[tool.coverage.run]
branch = true
source = ["pycrc"]
# Subprocesses (the generated-code and CLI tests) inherit the coverage
# configuration through COVERAGE_PROCESS_START, so collect their data too.
parallel = true

[tool.coverage.report]
show_missing = true
fail_under = 80
